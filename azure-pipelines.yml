  # ---------------------------------------------------------
  # DORA — Deployment Frequency & Change Lead Time
  # Fires when ALL above steps succeed.
  # Jira reads this as a successful production deployment.
  # The pipeline run URL is attached so Jira can compute
  # lead time from the linked commit timestamp.
  # ---------------------------------------------------------
  - script: |
      COMMIT_MSG="$(Build.SourceVersionMessage)"
      PIPELINE_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"

      # Extract Jira issue key from commit message (e.g. ENG-42)
      ISSUE_KEY=$(echo "$COMMIT_MSG" | grep -oP '[A-Z]+-[0-9]+' | head -1)

      if [ -z "$ISSUE_KEY" ]; then
        echo "No Jira issue key found in commit message — skipping Jira notification"
        echo "Tip: start your commit message with ENG-XX to link deployments"
        exit 0
      fi

      echo "Notifying Jira for issue: $ISSUE_KEY"

      # Log a deployment event against the Jira issue
      curl -s -X POST \
        "$(jiraBaseUrl)/rest/api/3/issue/$ISSUE_KEY/comment" \
        -u "$(jiraEmail):$(jiraToken)" \
        -H "Content-Type: application/json" \
        -d "{
          \"body\": {
            \"type\": \"doc\",
            \"version\": 1,
            \"content\": [{
              \"type\": \"paragraph\",
              \"content\": [{
                \"type\": \"text\",
                \"text\": \"✅ Deployed to production | Build: $(Build.BuildId) | Commit: $(Build.SourceVersion) | Pipeline: $PIPELINE_URL\"
              }]
            }]
          }
        }"

      echo "Jira deployment comment posted for $ISSUE_KEY"
    displayName: "Notify Jira — deployment succeeded"
    condition: succeeded()
    env:
      jiraBaseUrl: $(JIRA_BASE_URL)
      jiraEmail: $(JIRA_USER_EMAIL)
      jiraToken: $(JIRA_API_TOKEN)

  # ---------------------------------------------------------
  # DORA — Change Failure Rate
  # Fires only when any step above fails.
  # Posts a failure comment to the Jira issue so you can
  # track how many deployments fail vs succeed per sprint.
  # ---------------------------------------------------------
  - script: |
      COMMIT_MSG="$(Build.SourceVersionMessage)"
      PIPELINE_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"

      ISSUE_KEY=$(echo "$COMMIT_MSG" | grep -oP '[A-Z]+-[0-9]+' | head -1)

      if [ -z "$ISSUE_KEY" ]; then
        echo "No Jira issue key found — skipping failure notification"
        exit 0
      fi

      echo "Notifying Jira of failed deployment for: $ISSUE_KEY"

      curl -s -X POST \
        "$(jiraBaseUrl)/rest/api/3/issue/$ISSUE_KEY/comment" \
        -u "$(jiraEmail):$(jiraToken)" \
        -H "Content-Type: application/json" \
        -d "{
          \"body\": {
            \"type\": \"doc\",
            \"version\": 1,
            \"content\": [{
              \"type\": \"paragraph\",
              \"content\": [{
                \"type\": \"text\",
                \"text\": \"❌ Deployment FAILED | Build: $(Build.BuildId) | Commit: $(Build.SourceVersion) | Pipeline: $PIPELINE_URL\"
              }]
            }]
          }
        }"

      echo "Jira failure comment posted for $ISSUE_KEY"
    displayName: "Notify Jira — deployment failed (Change Failure Rate)"
    condition: failed()
    env:
      jiraBaseUrl: $(JIRA_BASE_URL)
      jiraEmail: $(JIRA_USER_EMAIL)
      jiraToken: $(JIRA_API_TOKEN)
