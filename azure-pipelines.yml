trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

# ----------------------------------------------------------
# These variables need to be added in ADO:
# Pipeline → Edit → Variables → Add each one as secret
#   JIRA_BASE_URL   → https://your-instance.atlassian.net
#   JIRA_USER_EMAIL → your Atlassian login email
#   JIRA_API_TOKEN  → from id.atlassian.com/manage-profile/security/api-tokens
#   JIRA_PROJECT_KEY → ENG-POC
# -------------------------------------------------------------
variables:
  jiraBaseUrl: $(JIRA_BASE_URL)
  jiraEmail: $(JIRA_USER_EMAIL)
  jiraToken: $(JIRA_API_TOKEN)
  jiraProjectKey: $(JIRA_PROJECT_KEY)
  pipelineEnv: production

steps:
