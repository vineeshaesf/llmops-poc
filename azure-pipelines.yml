trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  jiraBaseUrl: $(JIRA_BASE_URL)
  jiraEmail: $(JIRA_USER_EMAIL)
  jiraToken: $(JIRA_API_TOKEN)

steps:
  - task: UseDotNet@2
    inputs:
      packageType: "sdk"
      version: "8.x"

  - script: |
      cd app
      dotnet restore > ../build.log 2>&1 || true
      dotnet build   >> ../build.log 2>&1 || true
    displayName: "Build and capture logs"

  - script: |
      echo "===== BUILD LOG ====="
      cat build.log
    displayName: "Print logs"

  - script: |
      curl -fsSL https://ollama.com/install.sh | sh
      ollama serve &
      sleep 5
      ollama pull llama3.2
    displayName: "Install Ollama + pull model"

  - script: |
      pip install -r llmops/requirements.txt
    displayName: "Install Python deps"

  - script: |
      python llmops/analyze_no_rag.py
    displayName: "LLM Analysis (No RAG)"

  - script: |
      python llmops/analyze_rag.py
    displayName: "LLM Analysis (RAG)"

  - script: |
      # BUILD_MSG is injected via env: below — avoids ADO inline expansion issues
      echo "Raw commit message: '$BUILD_MSG'"
      echo "Build ID: '$BUILD_ID'"

      PIPELINE_URL="${COLLECTION_URI}${TEAM_PROJECT}/_build/results?buildId=${BUILD_ID}"

      # Extract Jira key e.g. EP-1 from commit message
      ISSUE_KEY=$(echo "$BUILD_MSG" | grep -oE '[A-Z]+-[0-9]+' | head -1)

      echo "Extracted issue key: '$ISSUE_KEY'"

      if [ -z "$ISSUE_KEY" ]; then
        echo "No Jira issue key found — skipping Jira notification"
        echo "Tip: start commit message with EP-XX e.g. EP-1 your message"
        exit 0
      fi

      echo "Notifying Jira for issue: $ISSUE_KEY"

      HTTP_STATUS=$(curl -s -o /tmp/jira_response.txt -w "%{http_code}" -X POST \
        "${JIRA_URL}/rest/api/3/issue/${ISSUE_KEY}/comment" \
        -u "${JIRA_EMAIL}:${JIRA_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{
          \"body\": {
            \"type\": \"doc\",
            \"version\": 1,
            \"content\": [{
              \"type\": \"paragraph\",
              \"content\": [{
                \"type\": \"text\",
                \"text\": \"Deployed to production | Build: ${BUILD_ID} | Commit: ${COMMIT_SHA} | Pipeline: ${PIPELINE_URL}\"
              }]
            }]
          }
        }")

      echo "Jira API status: $HTTP_STATUS"
      cat /tmp/jira_response.txt

      if [ "$HTTP_STATUS" -eq 201 ]; then
        echo "SUCCESS — comment posted to $ISSUE_KEY"
      else
        echo "FAILED — Jira API returned $HTTP_STATUS"
      fi
    displayName: "Notify Jira — deployment succeeded"
    condition: succeeded()
    env:
      BUILD_MSG: $(Build.SourceVersionMessage)
      BUILD_ID: $(Build.BuildId)
      COMMIT_SHA: $(Build.SourceVersion)
      COLLECTION_URI: $(System.TeamFoundationCollectionUri)
      TEAM_PROJECT: $(System.TeamProject)
      JIRA_URL: $(JIRA_BASE_URL)
      JIRA_EMAIL: $(JIRA_USER_EMAIL)
      JIRA_TOKEN: $(JIRA_API_TOKEN)

  - script: |
      echo "Raw commit message: '$BUILD_MSG'"

      PIPELINE_URL="${COLLECTION_URI}${TEAM_PROJECT}/_build/results?buildId=${BUILD_ID}"

      ISSUE_KEY=$(echo "$BUILD_MSG" | grep -oE '[A-Z]+-[0-9]+' | head -1)

      echo "Extracted issue key: '$ISSUE_KEY'"

      if [ -z "$ISSUE_KEY" ]; then
        echo "No Jira issue key found — skipping failure notification"
        exit 0
      fi

      HTTP_STATUS=$(curl -s -o /tmp/jira_fail.txt -w "%{http_code}" -X POST \
        "${JIRA_URL}/rest/api/3/issue/${ISSUE_KEY}/comment" \
        -u "${JIRA_EMAIL}:${JIRA_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{
          \"body\": {
            \"type\": \"doc\",
            \"version\": 1,
            \"content\": [{
              \"type\": \"paragraph\",
              \"content\": [{
                \"type\": \"text\",
                \"text\": \"Deployment FAILED | Build: ${BUILD_ID} | Commit: ${COMMIT_SHA} | Pipeline: ${PIPELINE_URL}\"
              }]
            }]
          }
        }")

      echo "Jira API status: $HTTP_STATUS"
      cat /tmp/jira_fail.txt
    displayName: "Notify Jira — deployment failed"
    condition: failed()
    env:
      BUILD_MSG: $(Build.SourceVersionMessage)
      BUILD_ID: $(Build.BuildId)
      COMMIT_SHA: $(Build.SourceVersion)
      COLLECTION_URI: $(System.TeamFoundationCollectionUri)
      TEAM_PROJECT: $(System.TeamProject)
      JIRA_URL: $(JIRA_BASE_URL)
      JIRA_EMAIL: $(JIRA_USER_EMAIL)
      JIRA_TOKEN: $(JIRA_API_TOKEN)