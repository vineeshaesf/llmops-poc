trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  jiraBaseUrl: $(JIRA_BASE_URL)
  jiraEmail: $(JIRA_USER_EMAIL)
  jiraToken: $(JIRA_API_TOKEN)
  jiraProjectKey: $(JIRA_PROJECT_KEY)
  pipelineEnv: production

steps:
  - task: UseDotNet@2
    inputs:
      packageType: "sdk"
      version: "8.x"

  - script: |
      cd app
      dotnet restore > ../build.log 2>&1 || true
      dotnet build   >> ../build.log 2>&1 || true
    displayName: "Build and capture logs"

  - script: |
      echo "===== BUILD LOG ====="
      cat build.log
    displayName: "Print logs"

  - script: |
      curl -fsSL https://ollama.com/install.sh | sh
      ollama serve &
      sleep 5
      ollama pull llama3.2
    displayName: "Install Ollama + pull model"

  - script: |
      pip install -r llmops/requirements.txt
    displayName: "Install Python deps"

  - script: |
      python llmops/analyze_no_rag.py
    displayName: "LLM Analysis (No RAG)"

  - script: |
      python llmops/analyze_rag.py
    displayName: "LLM Analysis (RAG)"

  - script: |
      COMMIT_MSG="$(Build.SourceVersionMessage)"
      PIPELINE_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"

      echo "Full commit message: $COMMIT_MSG"

      # Fixed: use -E (extended regex) instead of -P (perl regex)
      ISSUE_KEY=$(echo "$COMMIT_MSG" | grep -oE '[A-Z]+-[0-9]+' | head -1)

      echo "Extracted issue key: '$ISSUE_KEY'"

      if [ -z "$ISSUE_KEY" ]; then
        echo "No Jira issue key found in commit message — skipping Jira notification"
        echo "Tip: start your commit message with EP-XX e.g. EP-1 your message here"
        exit 0
      fi

      echo "Notifying Jira for issue: $ISSUE_KEY"

      HTTP_STATUS=$(curl -s -o /tmp/jira_response.txt -w "%{http_code}" -X POST \
        "$(jiraBaseUrl)/rest/api/3/issue/$ISSUE_KEY/comment" \
        -u "$(jiraEmail):$(jiraToken)" \
        -H "Content-Type: application/json" \
        -d "{
          \"body\": {
            \"type\": \"doc\",
            \"version\": 1,
            \"content\": [{
              \"type\": \"paragraph\",
              \"content\": [{
                \"type\": \"text\",
                \"text\": \"Deployed to production | Build: $(Build.BuildId) | Commit: $(Build.SourceVersion) | Pipeline: $PIPELINE_URL\"
              }]
            }]
          }
        }")

      echo "Jira API response code: $HTTP_STATUS"
      echo "Jira API response body:"
      cat /tmp/jira_response.txt

      if [ "$HTTP_STATUS" -eq 201 ]; then
        echo "Jira deployment comment posted successfully for $ISSUE_KEY"
      else
        echo "Warning: Jira API returned $HTTP_STATUS — check credentials and issue key"
      fi
    displayName: "Notify Jira — deployment succeeded"
    condition: succeeded()
    env:
      jiraBaseUrl: $(JIRA_BASE_URL)
      jiraEmail: $(JIRA_USER_EMAIL)
      jiraToken: $(JIRA_API_TOKEN)

  - script: |
      COMMIT_MSG="$(Build.SourceVersionMessage)"
      PIPELINE_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"

      echo "Full commit message: $COMMIT_MSG"

      ISSUE_KEY=$(echo "$COMMIT_MSG" | grep -oE '[A-Z]+-[0-9]+' | head -1)

      echo "Extracted issue key: '$ISSUE_KEY'"

      if [ -z "$ISSUE_KEY" ]; then
        echo "No Jira issue key found — skipping failure notification"
        exit 0
      fi

      echo "Notifying Jira of failed deployment for: $ISSUE_KEY"

      HTTP_STATUS=$(curl -s -o /tmp/jira_fail_response.txt -w "%{http_code}" -X POST \
        "$(jiraBaseUrl)/rest/api/3/issue/$ISSUE_KEY/comment" \
        -u "$(jiraEmail):$(jiraToken)" \
        -H "Content-Type: application/json" \
        -d "{
          \"body\": {
            \"type\": \"doc\",
            \"version\": 1,
            \"content\": [{
              \"type\": \"paragraph\",
              \"content\": [{
                \"type\": \"text\",
                \"text\": \"Deployment FAILED | Build: $(Build.BuildId) | Commit: $(Build.SourceVersion) | Pipeline: $PIPELINE_URL\"
              }]
            }]
          }
        }")

      echo "Jira API response code: $HTTP_STATUS"
      cat /tmp/jira_fail_response.txt
    displayName: "Notify Jira — deployment failed"
    condition: failed()
    env:
      jiraBaseUrl: $(JIRA_BASE_URL)
      jiraEmail: $(JIRA_USER_EMAIL)
      jiraToken: $(JIRA_API_TOKEN)